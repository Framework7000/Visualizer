<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GradeNext</title>
    <script type="text/javascript">
      // Automatically redirect 404 subpaths to HashRouter path for GitHub Pages
      var path = window.location.pathname;
      var repo = '/Visualizer';
      var subPath = path.startsWith(repo) ? path.substring(repo.length) : path;
      if (subPath && subPath !== '/') {
        window.location.replace(window.location.origin + repo + '/#' + subPath + window.location.search);
      } else {
        window.location.replace(window.location.origin + repo + '/#/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
